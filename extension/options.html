<!doctype html>
<meta charset="utf-8">
<title>ThunderMCP settings</title>
<style>
  body { max-width: 520px; margin: 24px auto; padding: 0 16px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #141413; background: #FAF9F5; }
  h1 { font-size: 18px; }
  fieldset { margin: 16px 0; padding: 12px 16px; border: 1px solid #e5e2d8; border-radius: 8px; }
  legend { font-weight: 600; }
  label { display: block; margin: 8px 0 2px; }
  input[type=text], input[type=password], select { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
  .hint { color: #777; font-size: 12px; }
  button { padding: 6px 16px; border: 1px solid #19c3a6; border-radius: 8px; background: #fff; cursor: pointer; font: inherit; }
</style>
<h1>ThunderMCP settings</h1>
<fieldset>
  <legend>This browser</legend>
  <label for="profileName">Browser name (what agents see when picking a browser, e.g. "Work", "Personal")</label>
  <input id="profileName" type="text" maxlength="60">
</fieldset>
<fieldset>
  <legend>Small model</legend>
  <label for="provider">Provider</label>
  <select id="provider">
    <option value="openrouter">OpenRouter</option>
    <option value="typesafe">Typesafe</option>
  </select>
  <label for="key">Key</label>
  <input id="key" type="password" autocomplete="off" placeholder="Leave empty to keep">
  <p id="keyState" class="hint"></p>
  <label for="model">Model (leave empty for default)</label>
  <input id="model" type="text">
  <p class="hint">The key is stored only in the local MCP config file and is never shown here.</p>
  <p id="settingsError" class="hint"></p>
</fieldset>
<fieldset>
  <legend>Input method</legend>
  <label for="clickMode">How to send mouse / keyboard input</label>
  <select id="clickMode">
    <option value="debugger">Debugger (trusted events, default)</option>
    <option value="dom">In-page synthetic events (no debugger; some sites reject them)</option>
  </select>
</fieldset>
<button id="save">Save</button>
<span id="saved" class="hint"></span>
<script type="module" src="options.js"></script>
